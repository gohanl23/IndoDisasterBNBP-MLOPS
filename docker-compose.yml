services:

  api:
    build: .
    container_name: indodisaster-api
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus
    container_name: indodisaster-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    container_name: indodisaster-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus